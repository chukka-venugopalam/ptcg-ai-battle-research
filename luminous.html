  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>For You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #bfe3f0;
    --sky-mid: #eaf7d8;
    --sky-warm: #fff2c9;
    --ink: #3a2e1f;
    --ink-dim: #6b5d47;
    --coral: #e2703a;
    --card: rgba(255,255,255,0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-warm) 100%);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
  }

  #petalCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #revealScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
  }

  .reveal-inner {
    max-width: 640px;
    width: 100%;
    padding: 10vh 24px 0 24px;
    text-align: center;
  }

  .word-block {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    margin-bottom: 46px;
  }

  .word-block.show {
    opacity: 1;
    transform: translateY(0);
  }

  .word-block .the-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 6.5vw, 3.4rem);
    color: var(--coral);
    letter-spacing: 0.03em;
    margin: 0;
  }

  .word-block .the-meaning {
    font-family: 'Work Sans', sans-serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--ink-dim);
    margin-top: 10px;
  }

  .word-block .the-song {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-top: 22px;
    opacity: 0.9;
  }

  .word-block .song-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--coral);
    font-size: 0.95rem;
  }

  #messageBlock {
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  #messageBlock.show { opacity: 1; }

  #messageText {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
    text-align: left;
  }

  .emph {
    font-size: 1.4em;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--coral);
  }

  .cursor {
    display: inline-block;
    width: 2px;
    background: var(--coral);
    margin-left: 2px;
    animation: blink 0.9s step-start infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .signoff {
    margin-top: 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(58,46,31,0.55);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .signoff.show { opacity: 1; }

  .bottom-spacer {
    height: 8em;
    width: 100%;
  }

  @media (max-width: 480px) {
    .reveal-inner { padding-top: 8vh; }
  }
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>

<div id="revealScreen">
  <div class="reveal-inner">
    <div class="word-block" id="wordBlock">
      <p class="the-word">LUMINOUS</p>
      <p class="the-meaning">/ˈlo͞omənəs/ — giving off light, glowing with warmth and confidence, brightening whatever room it's in</p>
      <p class="the-song">The song that reminds me of you: <span class="song-title">"Here Comes the Sun" — The Beatles</span></p>
    </div>
    <div id="messageBlock">
      <div id="messageText"></div>
      <div class="signoff" id="signoff">— Thank you, Anchor.</div>
      <div class="bottom-spacer"></div>
    </div>
  </div>
</div>

<script>
/* ================= PETAL BACKGROUND (spring) ================= */
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const petalColors = ['#f6a6b8', '#f6c28b', '#e8b4f8', '#f7e07f', '#a8dfc0', '#f2938a'];

function makePetal() {
  return {
    x: Math.random() * w,
    y: Math.random() * -h,
    size: 7 + Math.random() * 10,
    speedY: 0.35 + Math.random() * 0.8,
    swaySpeed: 0.35 + Math.random() * 0.7,
    swayAmp: 25 + Math.random() * 45,
    swayOffset: Math.random() * Math.PI * 2,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - 0.5) * 0.03,
    color: petalColors[Math.floor(Math.random() * petalColors.length)],
    opacity: 0.6 + Math.random() * 0.35
  };
}

const petalCount = Math.min(55, Math.floor((window.innerWidth * window.innerHeight) / 19000));
let petals = Array.from({ length: petalCount }, makePetal);

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.globalAlpha = p.opacity;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size, p.size * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

let t = 0;
function animate() {
  ctx.clearRect(0, 0, w, h);
  t += 0.016;
  for (const p of petals) {
    p.y += p.speedY;
    p.x += Math.sin(t * p.swaySpeed + p.swayOffset) * 0.7;
    p.rotation += p.rotationSpeed;
    if (p.y - p.size > h) {
      Object.assign(p, makePetal());
      p.y = -p.size;
    }
    drawPetal(p);
  }
  requestAnimationFrame(animate);
}
animate();

/* ================= MESSAGE + HIGHLIGHTS ================= */
const message = `You were the first person I talked to outside of college, and the first girl in my class to talk to me — and the first to help me during an exam. I'm genuinely thankful you did, and glad to know there was someone like you willing to talk to me.

I've always wondered where you get that confidence — speaking in front of a crowd with a face as bright, or brighter, than the sun. I hope no clouds ever get in the way of that shine.

I never thought I'd write something like this to anyone, especially not to you. But some things are easier to put into words this way than in a chat. If anything here makes you uncomfortable, or if I've said something wrong, I'm sorry in advance — but I wanted to say it anyway.

If you ever need someone to talk to, or help in any other way, I'll be there. Though I hope, more than that, you stay exactly as independent and courageous as you already are — someone who never really needs the help.

And never lose your smile. Congratulations on your internship. I hope your life ahead looks like spring — full of bright colors, just like this page.`;

const highlightPhrases = [
  "I'm genuinely thankful",
  "brighter than the sun",
  "never lose your smile",
  "Congratulations on your internship"
];

function computeSegments(text, phrases) {
  const ranges = [];
  for (const phrase of phrases) {
    const idx = text.indexOf(phrase);
    if (idx !== -1) ranges.push({ start: idx, end: idx + phrase.length });
  }
  ranges.sort((a, b) => a.start - b.start);
  const merged = [];
  for (const r of ranges) {
    if (merged.length && r.start < merged[merged.length - 1].end) continue;
    merged.push(r);
  }
  const segments = [];
  let pos = 0;
  for (const r of merged) {
    if (r.start > pos) segments.push({ start: pos, end: r.start, highlight: false });
    segments.push({ start: r.start, end: r.end, highlight: true });
    pos = r.end;
  }
  if (pos < text.length) segments.push({ start: pos, end: text.length, highlight: false });
  return segments;
}

const segments = computeSegments(message, highlightPhrases);

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTyped(i) {
  let html = '';
  for (const seg of segments) {
    if (seg.start >= i) break;
    const end = Math.min(seg.end, i);
    const chunk = escapeHtml(message.slice(seg.start, end)).replace(/\n/g, '<br/>');
    html += seg.highlight ? `<span class="emph">${chunk}</span>` : chunk;
  }
  return html;
}

function runReveal() {
  document.getElementById('wordBlock').classList.add('show');
  setTimeout(() => {
    document.getElementById('messageBlock').classList.add('show');
    typeMessage();
  }, 1800);
}

function typeMessage() {
  const el = document.getElementById('messageText');
  const scrollContainer = document.getElementById('revealScreen');
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.innerHTML = '&nbsp;';
  let i = 0;

  function baseDelay(ch) {
    if (ch === '.' || ch === '!') return 380;
    if (ch === ',') return 180;
    if (ch === '\n') return 420;
    return 32 + Math.random() * 28;
  }

  function step() {
    if (i < message.length) {
      const ch = message[i];
      i++;
      el.innerHTML = renderTyped(i);
      el.appendChild(cursor);
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
      setTimeout(step, baseDelay(ch));
    } else {
      cursor.remove();
      document.getElementById('signoff').classList.add('show');
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }
  }
  step();
}

window.addEventListener('load', () => setTimeout(runReveal, 600));
</script>
</body>
</html>
