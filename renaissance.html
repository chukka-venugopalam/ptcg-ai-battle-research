<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>For You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --winter-deep: #0a1420;
    --winter-mid: #16283a;
    --ice: #7fa8c9;
    --frost: #dbe9f4;
    --silver: #a9bdd0;
    --snow: #f5f9fc;
    --gold: #c9d8e8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 15%, var(--winter-mid), var(--winter-deep) 75%);
    font-family: 'Work Sans', sans-serif;
    color: var(--snow);
  }

  #snowCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #revealScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
  }

  .reveal-inner {
    max-width: 640px;
    width: 100%;
    padding: 10vh 24px 0 24px;
    text-align: center;
  }

  .word-block {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    margin-bottom: 46px;
  }

  .word-block.show {
    opacity: 1;
    transform: translateY(0);
  }

  .word-block .the-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 6.5vw, 3.3rem);
    color: var(--frost);
    letter-spacing: 0.03em;
    margin: 0;
  }

  .word-block .the-meaning {
    font-family: 'Work Sans', sans-serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--silver);
    margin-top: 10px;
  }

  .word-block .the-song {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--silver);
    margin-top: 22px;
    opacity: 0.85;
  }

  .word-block .song-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--frost);
    font-size: 0.95rem;
  }

  #messageBlock {
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  #messageBlock.show { opacity: 1; }

  #messageText {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    line-height: 1.85;
    color: var(--snow);
    white-space: pre-wrap;
    text-align: left;
  }

  .emph {
    font-size: 1.4em;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--frost);
  }

  .cursor {
    display: inline-block;
    width: 2px;
    background: var(--frost);
    margin-left: 2px;
    animation: blink 0.9s step-start infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .signoff {
    margin-top: 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(169,189,208,0.7);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .signoff.show { opacity: 1; }

  .bottom-spacer {
    height: 8em;
    width: 100%;
  }

  @media (max-width: 480px) {
    .reveal-inner { padding-top: 8vh; }
  }
</style>
</head>
<body>

<canvas id="snowCanvas"></canvas>

<div id="revealScreen">
  <div class="reveal-inner">
    <div class="word-block" id="wordBlock">
      <p class="the-word">RENAISSANCE</p>
      <p class="the-meaning">/ˈren.ə.säns/ — someone gifted across many arts at once: painter, writer, singer, dancer, organizer, all at home in the same person</p>
      <p class="the-song">The song that reminds me of you: <span class="song-title">"Iris" — Goo Goo Dolls</span></p>
    </div>
    <div id="messageBlock">
      <div id="messageText"></div>
      <div class="signoff" id="signoff">— Thank you, Future IAS.</div>
      <div class="bottom-spacer"></div>
    </div>
  </div>
</div>

<script>
/* ================= SNOW BACKGROUND ================= */
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function makeFlake() {
  return {
    x: Math.random() * w,
    y: Math.random() * -h,
    radius: 1.2 + Math.random() * 3.2,
    speedY: 0.3 + Math.random() * 0.9,
    swaySpeed: 0.3 + Math.random() * 0.6,
    swayAmp: 15 + Math.random() * 35,
    swayOffset: Math.random() * Math.PI * 2,
    opacity: 0.35 + Math.random() * 0.55
  };
}

const flakeCount = Math.min(140, Math.floor((window.innerWidth * window.innerHeight) / 9000));
let flakes = Array.from({ length: flakeCount }, makeFlake);

function drawFlake(flake) {
  ctx.save();
  ctx.globalAlpha = flake.opacity;
  ctx.fillStyle = '#f5f9fc';
  ctx.shadowColor = 'rgba(219,233,244,0.8)';
  ctx.shadowBlur = flake.radius * 2;
  ctx.beginPath();
  ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

let t = 0;
function animate() {
  ctx.clearRect(0, 0, w, h);
  t += 0.016;
  for (const flake of flakes) {
    flake.y += flake.speedY;
    flake.x += Math.sin(t * flake.swaySpeed + flake.swayOffset) * 0.5;
    if (flake.y - flake.radius > h) {
      Object.assign(flake, makeFlake());
      flake.y = -flake.radius;
    }
    drawFlake(flake);
  }
  requestAnimationFrame(animate);
}
animate();

/* ================= MESSAGE + HIGHLIGHTS ================= */
const message = `The first day I stepped into class five, everyone was talking about a new girl — said to be brilliant, and a curiosity to everyone. Then I saw her: a bright face, a kind gesture. I wanted to talk to her, but there was an invisible wall telling me she was somewhere I couldn't reach.

Then, on one lucky day, I did. Her voice was gentle, carrying its own quiet aura. As time went on, we talked, we discussed things, we played together at school. I don't know how, but two years passed like that — and I can say, without doubt, those were the best years of my school life.

Then came a class shift, and the distance between us grew. I started to wonder if those years had only been a dream, and that the distance would never close again. Every time I saw you after that, there was a pull to talk to you — but I never could.

Three years passed, carrying a pandemic along with them. Then, unexpectedly, I found myself back in your class. The first thing I heard from you, after three years, was: "You still didn't change." I'd forgotten the context long ago, but that gentleness in your voice — I remembered it instantly, straight from the heart. That year, we talked again, and I felt the gap closing. But even that turned out to be another mirage my mind and heart had built.

Then, on an ordinary Sunday, I saw you in a white dress. I've always believed angels wear white. Since that day, that image has never left me — even now, every white dress I see brings me back to you.

After class seven, I told myself it was just attraction, just infatuation. I reasoned it away — you're pretty, well-mannered, mature, you have a wonderful sense of humor, and more than anything, you're kind and gentle. But even now, I can't fully explain why I liked you the way I did.

All I really want to say is — thank you for showing me, for letting me experience, what love feels like. I know I'm a black mark on your page of pure white, so I'm sorry for disturbing you. But I want to say it anyway: I loved you.

I don't know if you'll ever read this, or if you've already moved on. But as my last words — if you ever need help, I'll be there. A reliable classmate, someone to talk through your worries with, or help in any way I can.

And congratulations on getting into NIT.`;

const highlightPhrases = [
  "those were the best years of my school life",
  "\"You still didn't change.\"",
  "I loved you",
  "I'll be there"
];

function computeSegments(text, phrases) {
  const ranges = [];
  for (const phrase of phrases) {
    const idx = text.indexOf(phrase);
    if (idx !== -1) ranges.push({ start: idx, end: idx + phrase.length });
  }
  ranges.sort((a, b) => a.start - b.start);
  const merged = [];
  for (const r of ranges) {
    if (merged.length && r.start < merged[merged.length - 1].end) continue;
    merged.push(r);
  }
  const segments = [];
  let pos = 0;
  for (const r of merged) {
    if (r.start > pos) segments.push({ start: pos, end: r.start, highlight: false });
    segments.push({ start: r.start, end: r.end, highlight: true });
    pos = r.end;
  }
  if (pos < text.length) segments.push({ start: pos, end: text.length, highlight: false });
  return segments;
}

const segments = computeSegments(message, highlightPhrases);

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTyped(i) {
  let html = '';
  for (const seg of segments) {
    if (seg.start >= i) break;
    const end = Math.min(seg.end, i);
    const chunk = escapeHtml(message.slice(seg.start, end)).replace(/\n/g, '<br/>');
    html += seg.highlight ? `<span class="emph">${chunk}</span>` : chunk;
  }
  return html;
}

function runReveal() {
  document.getElementById('wordBlock').classList.add('show');
  setTimeout(() => {
    document.getElementById('messageBlock').classList.add('show');
    typeMessage();
  }, 1800);
}

// The point in `message` right before the animated word ("classmate") begins.
const animAnchor = 'A reliable ';
const animTriggerIndex = message.indexOf(animAnchor) + animAnchor.length;
const tempWord = 'friend'; // typed first, then backspaced away

function typeMessage() {
  const el = document.getElementById('messageText');
  const scrollContainer = document.getElementById('revealScreen');
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.innerHTML = '&nbsp;';
  let i = 0;
  let animPlayed = false;

  function baseDelay(ch) {
    if (ch === '.' || ch === '!') return 380;
    if (ch === ',') return 180;
    if (ch === '\n') return 420;
    return 32 + Math.random() * 28;
  }

  function playFriendToClassmateAnimation(done) {
    const baseHtml = renderTyped(i); // everything typed so far, up to "A reliable "
    const letters = tempWord.split('');
    let shown = '';
    let idx = 0;

    function typeTemp() {
      if (idx < letters.length) {
        shown += letters[idx];
        idx++;
        el.innerHTML = baseHtml + shown;
        el.appendChild(cursor);
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
        setTimeout(typeTemp, 55 + Math.random() * 30);
      } else {
        setTimeout(eraseTemp, 700); // let "friend" sit for a beat before it's taken back
      }
    }

    function eraseTemp() {
      if (shown.length > 0) {
        shown = shown.slice(0, -1);
        el.innerHTML = baseHtml + shown;
        el.appendChild(cursor);
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
        setTimeout(eraseTemp, 45);
      } else {
        setTimeout(done, 350); // brief pause before "classmate" begins typing
      }
    }

    typeTemp();
  }

  function step() {
    if (!animPlayed && i === animTriggerIndex) {
      animPlayed = true;
      playFriendToClassmateAnimation(() => setTimeout(step, 0));
      return;
    }
    if (i < message.length) {
      const ch = message[i];
      i++;
      el.innerHTML = renderTyped(i);
      el.appendChild(cursor);
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
      setTimeout(step, baseDelay(ch));
    } else {
      cursor.remove();
      document.getElementById('signoff').classList.add('show');
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }
  }
  step();
}

window.addEventListener('load', () => setTimeout(runReveal, 600));
</script>
</body>
</html>
