<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>For You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep: #0f2018;
    --forest-mid: #1c3326;
    --moss: #3a5a40;
    --sage: #a3b18a;
    --gold: #d4a373;
    --cream: #eef2e6;
    --cream-dim: #cdd6c4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--forest-mid), var(--forest-deep) 70%);
    font-family: 'Work Sans', sans-serif;
    color: var(--cream);
  }

  #leafCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #revealScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
  }

  .reveal-inner {
    max-width: 640px;
    width: 100%;
    padding: 10vh 24px 0 24px;
    text-align: center;
  }

  .word-block {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    margin-bottom: 46px;
  }

  .word-block.show {
    opacity: 1;
    transform: translateY(0);
  }

  .word-block .the-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    color: var(--gold);
    letter-spacing: 0.04em;
    margin: 0;
  }

  .word-block .the-meaning {
    font-family: 'Work Sans', sans-serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--cream-dim);
    margin-top: 10px;
  }

  .word-block .the-song {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--cream-dim);
    margin-top: 22px;
    opacity: 0.85;
  }

  .word-block .song-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 0.95rem;
  }

  #messageBlock {
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  #messageBlock.show { opacity: 1; }

  #messageText {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    line-height: 1.85;
    color: var(--cream);
    white-space: pre-wrap;
    text-align: left;
  }

  .emph {
    font-size: 1.4em;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--gold);
  }

  .cursor {
    display: inline-block;
    width: 2px;
    background: var(--gold);
    margin-left: 2px;
    animation: blink 0.9s step-start infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .signoff {
    margin-top: 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(163,177,138,0.6);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .signoff.show { opacity: 1; }

  /* keeps the last line from ever sitting flush against the bottom edge */
  .bottom-spacer {
    height: 8em; /* ~3 lines of body text + breathing room */
    width: 100%;
  }

  @media (max-width: 480px) {
    .reveal-inner { padding-top: 8vh; }
  }
</style>
</head>
<body>

<canvas id="leafCanvas"></canvas>

<div id="revealScreen">
  <div class="reveal-inner">
    <div class="word-block" id="wordBlock">
      <p class="the-word">GENIAL</p>
      <p class="the-meaning">/ˈjēnēəl/ — warm-hearted, easy to talk to, quietly and naturally good</p>
      <p class="the-song">The song that reminds me of you: <span class="song-title">"You've Got a Friend" — Carole King</span></p>
    </div>
    <div id="messageBlock">
      <div id="messageText"></div>
      <div class="signoff" id="signoff">— Thank you, Madam.</div>
      <div class="bottom-spacer"></div>
    </div>
  </div>
</div>

<script>
/* ================= LEAF BACKGROUND ================= */
const canvas = document.getElementById('leafCanvas');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const leafColors = ['#5c8a4f', '#7ea86a', '#3f6b3a', '#a9c98a', '#c9a15a', '#8a9a4f'];

function makeLeaf() {
  return {
    x: Math.random() * w,
    y: Math.random() * -h,
    size: 8 + Math.random() * 14,
    speedY: 0.4 + Math.random() * 0.9,
    swaySpeed: 0.4 + Math.random() * 0.8,
    swayAmp: 20 + Math.random() * 40,
    swayOffset: Math.random() * Math.PI * 2,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - 0.5) * 0.02,
    color: leafColors[Math.floor(Math.random() * leafColors.length)],
    opacity: 0.55 + Math.random() * 0.4
  };
}

const leafCount = Math.min(60, Math.floor((window.innerWidth * window.innerHeight) / 18000));
let leaves = Array.from({ length: leafCount }, makeLeaf);

function drawLeaf(leaf) {
  ctx.save();
  ctx.translate(leaf.x, leaf.y);
  ctx.rotate(leaf.rotation);
  ctx.globalAlpha = leaf.opacity;
  ctx.fillStyle = leaf.color;
  ctx.beginPath();
  const s = leaf.size;
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s * 0.8, -s * 0.5, s * 0.8, s * 0.5, 0, s);
  ctx.bezierCurveTo(-s * 0.8, s * 0.5, -s * 0.8, -s * 0.5, 0, -s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(0, s);
  ctx.stroke();
  ctx.restore();
}

let t = 0;
function animate() {
  ctx.clearRect(0, 0, w, h);
  t += 0.016;
  for (const leaf of leaves) {
    leaf.y += leaf.speedY;
    leaf.x += Math.sin(t * leaf.swaySpeed + leaf.swayOffset) * 0.6;
    leaf.rotation += leaf.rotationSpeed;
    if (leaf.y - leaf.size > h) {
      Object.assign(leaf, makeLeaf());
      leaf.y = -leaf.size;
    }
    drawLeaf(leaf);
  }
  requestAnimationFrame(animate);
}
animate();

/* ================= MESSAGE + HIGHLIGHTS ================= */
const message = `I wanted a group of friends I could talk to and just be myself with. I never really found them. I thought I had, once, but in the end there was no one there. For a while I thought that meant my school life was wasted.

But I'm happy, because I met you.

You talked to me, and somehow that made my last year of school a good one. I don't know if it was just your kindness, or your goodwill toward anyone who needed it — but I'm glad it reached me too.

Thank you for talking with me like a friend. I mean that more than it probably sounds.

If you ever need someone — to talk to, or need help — I'll be there. A reliable friend, whenever you need one.

But more than that, I hope you never have to need anyone's help at all. I hope you stay independent, courageous, and happy. Always.`;

// Phrases to render larger/emphasized as they're typed.
// Order matters only in that longer/more specific phrases should come first if they overlap.
const highlightPhrases = [
  "I'm happy, because I met you.",
  "Thank you",
  "I'll be there",
  "independent, courageous, and happy. Always."
];

// Precompute non-overlapping highlight ranges over the plain text.
function computeSegments(text, phrases) {
  const ranges = [];
  for (const phrase of phrases) {
    const idx = text.indexOf(phrase);
    if (idx !== -1) ranges.push({ start: idx, end: idx + phrase.length });
  }
  ranges.sort((a, b) => a.start - b.start);
  const merged = [];
  for (const r of ranges) {
    if (merged.length && r.start < merged[merged.length - 1].end) continue; // skip overlap
    merged.push(r);
  }
  const segments = [];
  let pos = 0;
  for (const r of merged) {
    if (r.start > pos) segments.push({ start: pos, end: r.start, highlight: false });
    segments.push({ start: r.start, end: r.end, highlight: true });
    pos = r.end;
  }
  if (pos < text.length) segments.push({ start: pos, end: text.length, highlight: false });
  return segments;
}

const segments = computeSegments(message, highlightPhrases);

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Build the HTML for "typed so far up to character index i" respecting highlight spans.
function renderTyped(i) {
  let html = '';
  for (const seg of segments) {
    if (seg.start >= i) break;
    const end = Math.min(seg.end, i);
    const chunk = escapeHtml(message.slice(seg.start, end)).replace(/\n/g, '<br/>');
    html += seg.highlight ? `<span class="emph">${chunk}</span>` : chunk;
  }
  return html;
}

function runReveal() {
  document.getElementById('wordBlock').classList.add('show');
  setTimeout(() => {
    document.getElementById('messageBlock').classList.add('show');
    typeMessage();
  }, 1800);
}

function typeMessage() {
  const el = document.getElementById('messageText');
  const scrollContainer = document.getElementById('revealScreen');
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.innerHTML = '&nbsp;';
  let i = 0;

  function baseDelay(ch) {
    if (ch === '.' || ch === '!') return 380;
    if (ch === ',') return 180;
    if (ch === '\n') return 420;
    return 32 + Math.random() * 28;
  }

  function step() {
    if (i < message.length) {
      const ch = message[i];
      i++;
      el.innerHTML = renderTyped(i);
      el.appendChild(cursor);
      // keep the growing text in view as it types
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
      setTimeout(step, baseDelay(ch));
    } else {
      cursor.remove();
      document.getElementById('signoff').classList.add('show');
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }
  }
  step();
}

window.addEventListener('load', () => setTimeout(runReveal, 600));
</script>
</body>
</html>
